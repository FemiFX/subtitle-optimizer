[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-optimizer"
version = "0.1.0"
description = "Turn word-level ASR timestamps into readable subtitle cues."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Oluwafemi Akinlosotu" }]
keywords = ["subtitles", "srt", "webvtt", "whisper", "asr", "captions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/FemiFX/subtitle-optimizer"

[tool.setuptools.packages.find]
include = ["subtitle_optimizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
